name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  django-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clinica_test
          POSTGRES_USER: clinica
          POSTGRES_PASSWORD: clinica
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-test-key
      DJANGO_DEBUG: "True"
      POSTGRES_DB: clinica_test
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      INTERNAL_SERVICE_TOKEN: ci-shared-secret
      WHATSAPP_GATEWAY_URL: http://localhost:8001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: django-api/requirements.txt
      - run: pip install -r django-api/requirements.txt
      - run: pip install ruff
      - name: Lint
        run: ruff check django-api/apps django-api/config
      - name: Migraciones (chequeo de consistencia)
        working-directory: django-api
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        working-directory: django-api
        run: python manage.py test --settings=config.settings_test

  whatsapp-gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: whatsapp-gateway/requirements.txt
      - run: pip install -r whatsapp-gateway/requirements.txt
      - run: pip install ruff pytest
      - name: Lint
        run: ruff check whatsapp-gateway/app whatsapp-gateway/main.py
