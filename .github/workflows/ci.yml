name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  django-tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-test-key-long-enough-for-hmac-validation
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      POSTGRES_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
      INTERNAL_SERVICE_TOKEN: ci-shared-secret
      WHATSAPP_GATEWAY_URL: http://localhost:8001
      USE_CLOUD_STORAGE: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: django-api/requirements.txt
      - name: Instalar dependencias
        run: pip install -r django-api/requirements.txt ruff
      - name: Lint
        run: ruff check django-api/apps django-api/config
      - name: Tests (SQLite en memoria)
        working-directory: django-api
        run: python manage.py test --settings=config.settings_test -v 2

  whatsapp-gateway-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: whatsapp-gateway/requirements.txt
      - name: Instalar dependencias
        run: pip install -r whatsapp-gateway/requirements.txt ruff
      - name: Lint
        run: ruff check whatsapp-gateway/app whatsapp-gateway/main.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build estático
        working-directory: frontend
        env:
          NEXT_EXPORT: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
