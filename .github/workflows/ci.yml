# El linter va con VERSIÓN FIJA a propósito. Instalándolo sin fijar, cada
# release nuevo puede cambiar qué reglas están activas por defecto y
# romper la compilación sin que nadie toque el código: pasó al salir la
# 0.16, que añadió al conjunto por defecto la ordenación de imports y
# varias reglas de modernización. El conjunto de reglas está declarado
# de forma explícita en `ruff.toml`, en la raíz del repositorio.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # `branches` filtra por la rama BASE, no por la del PR. Con solo
    # [main, develop], un PR apilado sobre otro —base `claude/...`— no
    # dispara nada: no sale en rojo, sale SIN CI, que se parece
    # demasiado a estar en verde. Pasó con la pila de cinco PR del
    # Sprint 70: cuatro de ellos llevaban semanas sin ejecutar una sola
    # comprobación y la última ejecución visible era de antes de dividir.
    branches: [main, develop, 'claude/**']

jobs:
  django-tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-test-key-long-enough-for-hmac-validation
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      POSTGRES_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
      INTERNAL_SERVICE_TOKEN: ci-shared-secret
      WHATSAPP_GATEWAY_URL: http://localhost:8001
      USE_CLOUD_STORAGE: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: django-api/requirements.txt
      - name: Instalar dependencias
        run: pip install -r django-api/requirements.txt ruff==0.16.1
      - name: Lint
        run: ruff check django-api/apps django-api/config
      - name: Tests (SQLite en memoria)
        working-directory: django-api
        run: python manage.py test --settings=config.settings_test -v 2

      # Segunda pasada con la clínica en un huso muy lejano del servidor.
      # Varios fallos han venido de mezclar la fecha del servidor con la
      # fecha local de la clínica, y solo aparecen cuando ambas difieren:
      # a las horas en que coinciden, la suite pasa igual. Kiritimati
      # (UTC+14) garantiza que no coincidan nunca.
      - name: Tests (huso lejano, frontera de fecha)
        working-directory: django-api
        env:
          DJANGO_TIME_ZONE: Pacific/Kiritimati
        run: python manage.py test --settings=config.settings_test

  whatsapp-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: whatsapp-gateway/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r whatsapp-gateway/requirements-dev.txt ruff==0.16.1
      - name: Lint
        run: ruff check whatsapp-gateway/app whatsapp-gateway/main.py whatsapp-gateway/tests
      - name: Tests
        working-directory: whatsapp-gateway
        run: python -m pytest tests -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build estático
        working-directory: frontend
        env:
          NEXT_EXPORT: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
