# Configuración del linter, común a todo el repositorio.
#
# POR QUÉ EXISTE ESTE ARCHIVO
# El CI instalaba `ruff` sin fijar versión, así que cada release nuevo
# podía cambiar el conjunto de reglas ACTIVAS POR DEFECTO y romper la
# compilación sin que nadie tocara una línea de código. Ocurrió al pasar
# de la 0.15 a la 0.16, que añadió al conjunto por defecto la ordenación
# de imports (I) y varias reglas de modernización (UP): 521 avisos en
# django-api y 3 en el gateway, en archivos que nadie había modificado.
#
# La solución tiene dos partes: fijar la versión de ruff en el CI y
# declarar aquí el conjunto de reglas de forma EXPLÍCITA. Con `select`
# explícito, lo que ruff considere por defecto en el futuro deja de
# afectarnos: el linter comprueba lo que este archivo dice, ni más ni
# menos, y el resultado es el mismo en el portátil que en el CI.

target-version = "py312"
line-length = 110

exclude = [
    "**/migrations/*",   # generadas por Django; su formato no lo decidimos nosotros
    "frontend",
    "node_modules",
]

[lint]
select = [
    "E4", "E7", "E9",   # errores de sintaxis y semántica (por defecto de ruff)
    "F",                # pyflakes: nombres sin usar, imports muertos, f-strings rotas
    "I",                # orden de imports (isort)
    "UP",               # modernización de sintaxis al target-version
]

[lint.isort]
known-first-party = ["apps", "config", "app"]
