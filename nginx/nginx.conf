worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 20M;

    upstream django_api {
        server django-api:8000;
    }

    upstream whatsapp_gateway {
        server whatsapp-gateway:8001;
    }

    server {
        listen 80;
        server_name _;

        # API y panel de administración de Django
        location /api/ {
            proxy_pass http://django_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /admin/ {
            proxy_pass http://django_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Webhook público de WhatsApp — únicamente esta ruta llega al gateway
        location /whatsapp/webhook {
            proxy_pass http://whatsapp_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Build estático de Next.js (panel web) — se monta aquí en la Fase 9/Frontend
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
