worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 20M;

    upstream django_api {
        server django-api:8000;
    }

    upstream whatsapp_gateway {
        server whatsapp-gateway:8001;
    }

    server {
        listen 80;
        server_name _;

        # API y panel de administración de Django
        location /api/ {
            proxy_pass http://django_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Archivos subidos ─────────────────────────────────────────
        # Django solo publica /media/ cuando DEBUG=True, así que en
        # producción esta ruta devolvía 404 y el logotipo de la clínica
        # no se veía. Se sirve desde disco, PERO solo la carpeta del
        # logotipo: el resto de /media/ son radiografías, documentos de
        # pacientes, consentimientos firmados y firmas manuscritas. Nginx
        # no sabe quién pide el archivo, de modo que publicarlos aquí los
        # dejaría al alcance de cualquiera que acierte la URL, sin sesión
        # y sin registro de acceso. Esos archivos se entregan por la API,
        # que valida clínica, paciente y permisos
        # (PatientDocumentFileView, Sprint 38).
        location /media/branding/ {
            alias /app/media/branding/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # Cortafuegos explícito: cualquier otra ruta bajo /media/ se niega
        # aquí, para que un cambio futuro no la abra por descuido.
        location /media/ {
            return 404;
        }

        location /static/ {
            proxy_pass http://django_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://django_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Webhook público de WhatsApp — únicamente esta ruta llega al gateway
        location /whatsapp/webhook {
            proxy_pass http://whatsapp_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Build estático de Next.js (panel web) — se monta aquí en la Fase 9/Frontend
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
