# ── Producción ────────────────────────────────────────────────────────
# Uso: docker compose -f docker-compose.prod.yml up -d --build
# Diferencias con el compose de desarrollo:
#  - gunicorn sin --reload y sin montar el código (imagen inmutable)
#  - Postgres y Redis SIN puertos expuestos al host
#  - el panel se compila a estático y lo sirve Nginx (sin next dev)
#  - restart: unless-stopped en todos los servicios

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # El compose de desarrollo tenía esta sonda y el de producción no, así
    # que aquí `depends_on: postgres` solo esperaba a que el contenedor
    # arrancara. En un arranque en frío o tras reiniciar el host, `migrate`
    # se ejecutaba contra una base que todavía no aceptaba conexiones: el
    # contenedor moría, `restart: unless-stopped` lo reintentaba y acababa
    # levantando, pero con un ciclo de caídas y el registro lleno de ruido.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  django-api:
    build: ./django-api
    restart: unless-stopped
    env_file: .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py bootstrap &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # La imagen es python:3.12-slim y no trae curl ni wget; urllib sí.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/ready/', timeout=5).status == 200 else 1)\""]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 60s

  celery-worker:
    build: ./django-api
    restart: unless-stopped
    env_file: .env
    command: celery -A config worker -l info --concurrency 2
    depends_on:
      django-api:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: ./django-api
    restart: unless-stopped
    env_file: .env
    command: celery -A config beat -l info
    depends_on:
      django-api:
        condition: service_healthy
      redis:
        condition: service_healthy

  whatsapp-gateway:
    build: ./whatsapp-gateway
    restart: unless-stopped
    env_file: .env
    command: uvicorn main:app --host 0.0.0.0 --port 8001

  # Compila el panel a estático y lo deja en el volumen que Nginx sirve.
  # Corre una vez en cada despliegue y termina (restart: "no").
  frontend-build:
    image: node:20-alpine
    working_dir: /app
    restart: "no"
    command: >
      sh -c "npm install --no-audit --no-fund &&
             NEXT_EXPORT=1 NEXT_TELEMETRY_DISABLED=1 npm run build &&
             rm -rf /static-out/* && cp -r out/. /static-out/"
    volumes:
      - ./frontend:/app
      - frontend_static:/static-out

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_static:/usr/share/nginx/html:ro
      - media_data:/app/media:ro
    depends_on:
      django-api:
        condition: service_healthy
      whatsapp-gateway:
        condition: service_started

volumes:
  postgres_data:
  media_data:
  frontend_static:
