services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinica}
      POSTGRES_USER: ${POSTGRES_USER:-clinica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinica}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  django-api:
    build: ./django-api
    env_file: .env
    volumes:
      - ./django-api:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload --workers 3"

  celery-worker:
    build: ./django-api
    env_file: .env
    volumes:
      - ./django-api:/app
    depends_on:
      - django-api
      - redis
    command: celery -A config.celery worker --loglevel=info

  celery-beat:
    build: ./django-api
    env_file: .env
    volumes:
      - ./django-api:/app
    depends_on:
      - django-api
      - redis
    command: celery -A config.celery beat --loglevel=info

  whatsapp-gateway:
    build: ./whatsapp-gateway
    env_file: .env
    volumes:
      - ./whatsapp-gateway:/app
    ports:
      - "8001:8001"
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - django-api
      - whatsapp-gateway

volumes:
  postgres_data:
